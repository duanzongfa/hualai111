name: Build Huailai

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'
        
    - name: Build for iOS
      run: |
        cd Source
        xcodebuild build \
          -project Huailai.xcodeproj \
          -scheme Huailai \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          CODE_SIGNING_ALLOWED=NO \
          derivedDataPath=../build
          
    - name: Package IPA
      run: |
        cd Source
        mkdir -p ../Payload
        cp -r ../build/Build/Products/Release-iphoneos/Huailai.app ../Payload/
        zip -r ../花来.ipa Payload/
        
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: huailai-ipa
        path: Source/花来.ipa
