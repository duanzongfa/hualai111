name: Build Huailai

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Huailai.xcodeproj \
            -scheme Huailai \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Huailai.app Payload/
          zip -qry Huailai.ipa Payload

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Huailai-ipa
          path: Huailai.ipa
          if-no-files-found: error